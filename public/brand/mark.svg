<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">StockRidge premium brand mark</title>
  <desc id="description">An emerald three-ridge emblem with the central ridge tallest. Three tightly stacked emerald cubic stock blocks rise through it, uniting inventory, progress and quiet strength.</desc>
  <defs>
    <linearGradient id="backdrop" x1="72" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2d20"/>
      <stop offset="0.55" stop-color="#071d14"/>
      <stop offset="1" stop-color="#04120d"/>
    </linearGradient>
    <linearGradient id="ridge-center" x1="220" y1="100" x2="310" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76e2a8"/>
      <stop offset="0.5" stop-color="#45c986"/>
      <stop offset="1" stop-color="#269761"/>
    </linearGradient>
    <linearGradient id="block-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="block-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#backdrop)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#b8e5ca" stroke-opacity="0.12" stroke-width="2"/>

  <g id="ridges">
    <path id="left-ridge" d="M64 376L92 326L116 268L148 144L174 242L198 300L224 376Z" fill="#1d6847"/>
    <path id="right-ridge" d="M288 376L316 300L340 238L366 154L392 252L420 314L448 376Z" fill="#155237"/>
    <path id="middle-ridge" d="M108 376L256 96L404 376Z" fill="url(#ridge-center)"/>
    <path d="M108 376L256 96L404 376" fill="none" stroke="#c5f4d8" stroke-opacity="0.24" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="stacked-blocks" stroke-linejoin="round">
    <path d="M370 166L382 172V376H370Z" fill="url(#block-side)"/>
    <rect x="160" y="166" width="210" height="210" fill="url(#block-front)" stroke="#333333" stroke-opacity=".5" stroke-width="2"/>
    <path id="cube-top" d="M160 166H370V236H160Z" fill="none"/>
    <path id="cube-middle" d="M160 236H370V306H160Z" fill="none"/>
    <path id="cube-bottom" d="M160 306H370V376H160Z" fill="none"/>
    <path d="M160 236H370M160 306H370" fill="none" stroke="#222222" stroke-opacity=".55" stroke-width="2"/>
    <path d="M160 166H370" fill="none" stroke="#444444" stroke-opacity=".65" stroke-width="2"/>
  </g>
</svg>
