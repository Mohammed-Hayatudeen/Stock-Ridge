<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">StockRidge premium brand mark</title>
  <desc id="description">An emerald three-ridge emblem with the central ridge tallest. Three precisely separated, gold-banded cubic stock blocks rise through it, uniting inventory, progress and quiet strength.</desc>
  <defs>
    <linearGradient id="backdrop" x1="72" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2d20"/>
      <stop offset="0.55" stop-color="#071d14"/>
      <stop offset="1" stop-color="#04120d"/>
    </linearGradient>
    <linearGradient id="ridge-center" x1="220" y1="100" x2="310" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76e2a8"/>
      <stop offset="0.5" stop-color="#45c986"/>
      <stop offset="1" stop-color="#269761"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9994e"/>
      <stop offset="0.5" stop-color="#e2cb87"/>
      <stop offset="1" stop-color="#b5974c"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#backdrop)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#b8e5ca" stroke-opacity="0.12" stroke-width="2"/>

  <g id="ridges">
    <path id="left-ridge" d="M64 376V330L105 298L148 224L184 270L224 340V376Z" fill="#1d6847"/>
    <path id="right-ridge" d="M288 376L326 316L366 240L405 288L448 326V376Z" fill="#155237"/>
    <path id="middle-ridge" d="M124 376L166 310L198 238L226 180L256 96L286 180L314 238L346 310L388 376Z" fill="url(#ridge-center)"/>
    <path d="M124 376L166 310L198 238L226 180L256 96L286 180L314 238L346 310L388 376" fill="none" stroke="#c5f4d8" stroke-opacity="0.24" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="stacked-blocks" stroke-linejoin="round">
    <g id="cube-top">
      <path d="M198 170L214 158H330L314 170Z" fill="#355444"/>
      <path d="M314 170L330 158V216L314 228Z" fill="#050d09"/>
      <rect x="198" y="170" width="116" height="58" rx="2" fill="#0c1812"/>
      <path d="M198 182H314V187H198Z" fill="url(#gold)"/>
      <path d="M314 182L330 170V175L314 187Z" fill="#a88b47"/>
      <path d="M198 170H314L330 158" fill="none" stroke="#6d8978" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <g id="cube-middle">
      <path d="M198 240L214 228H330L314 240Z" fill="#355444"/>
      <path d="M314 240L330 228V286L314 298Z" fill="#050d09"/>
      <rect x="198" y="240" width="116" height="58" rx="2" fill="#0c1812"/>
      <path d="M198 252H314V257H198Z" fill="url(#gold)"/>
      <path d="M314 252L330 240V245L314 257Z" fill="#a88b47"/>
      <path d="M198 240H314L330 228" fill="none" stroke="#6d8978" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <g id="cube-bottom">
      <path d="M198 310L214 298H330L314 310Z" fill="#355444"/>
      <path d="M314 310L330 298V356L314 368Z" fill="#050d09"/>
      <rect x="198" y="310" width="116" height="58" rx="2" fill="#0c1812"/>
      <path d="M198 322H314V327H198Z" fill="url(#gold)"/>
      <path d="M314 322L330 310V315L314 327Z" fill="#a88b47"/>
      <path d="M198 310H314L330 298" fill="none" stroke="#6d8978" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
  </g>
</svg>
