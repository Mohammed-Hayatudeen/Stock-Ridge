<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">StockRidge premium brand mark</title>
  <desc id="description">An emerald three-ridge emblem with the central ridge tallest. Three tightly stacked emerald cubic stock blocks rise through it, uniting inventory, progress and quiet strength.</desc>
  <defs>
    <linearGradient id="backdrop" x1="72" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2d20"/>
      <stop offset="0.55" stop-color="#071d14"/>
      <stop offset="1" stop-color="#04120d"/>
    </linearGradient>
    <linearGradient id="ridge-center" x1="220" y1="100" x2="310" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76e2a8"/>
      <stop offset="0.5" stop-color="#45c986"/>
      <stop offset="1" stop-color="#269761"/>
    </linearGradient>
    <linearGradient id="block-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13271d"/>
      <stop offset="0.55" stop-color="#0a1911"/>
      <stop offset="1" stop-color="#06110b"/>
    </linearGradient>
    <linearGradient id="block-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09150e"/>
      <stop offset="1" stop-color="#020805"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#backdrop)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#b8e5ca" stroke-opacity="0.12" stroke-width="2"/>

  <g id="ridges">
    <path id="left-ridge" d="M64 376L92 326L116 268L148 144L174 242L198 300L224 376Z" fill="#1d6847"/>
    <path id="right-ridge" d="M288 376L316 300L340 238L366 154L392 252L420 314L448 376Z" fill="#155237"/>
    <path id="middle-ridge" d="M108 376L132 286L154 202L184 142L218 110L256 96L294 110L328 142L358 202L380 286L404 376Z" fill="url(#ridge-center)"/>
    <path d="M108 376L132 286L154 202L184 142L218 110L256 96L294 110L328 142L358 202L380 286L404 376" fill="none" stroke="#c5f4d8" stroke-opacity="0.24" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="stacked-blocks" stroke-linejoin="round" transform="translate(-64 0) scale(1.25 .98947)">
    <g id="cube-top">
      <path d="M198 170L214 158H330L314 170Z" fill="#355444"/>
      <path d="M314 170L330 158V228L314 240Z" fill="url(#block-side)"/>
      <rect x="198" y="170" width="116" height="70" fill="url(#block-front)" stroke="#507461" stroke-opacity=".34" stroke-width="1"/>
      <path d="M198 170H314L330 158" fill="none" stroke="#6d8978" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <g id="cube-middle">
      <path d="M198 240L214 228H330L314 240Z" fill="#355444"/>
      <path d="M314 240L330 228V298L314 310Z" fill="url(#block-side)"/>
      <rect x="198" y="240" width="116" height="70" fill="url(#block-front)" stroke="#507461" stroke-opacity=".34" stroke-width="1"/>
      <path d="M198 240H314L330 228" fill="none" stroke="#6d8978" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <g id="cube-bottom">
      <path d="M198 310L214 298H330L314 310Z" fill="#355444"/>
      <path d="M314 310L330 298V368L314 380Z" fill="url(#block-side)"/>
      <rect x="198" y="310" width="116" height="70" fill="url(#block-front)" stroke="#507461" stroke-opacity=".34" stroke-width="1"/>
      <path d="M198 310H314L330 298" fill="none" stroke="#6d8978" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
  </g>
</svg>
