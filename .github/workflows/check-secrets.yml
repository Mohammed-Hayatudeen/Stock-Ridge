name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Diagnose
        run: |
          curl -s https://beta.stockridge0.workers.dev/api/diagnose > output2.txt
          cat output2.txt
          curl -s https://beta.stockridge0.workers.dev/api/auth/debug-pin > output3.txt
          cat output3.txt
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add output2.txt output3.txt
          git commit -m "Capture diagnose"
          git push
