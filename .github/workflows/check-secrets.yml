name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Login
        run: |
          curl -s -X POST https://beta.stockridge0.workers.dev/api/auth/login \
               -H 'content-type: application/json' \
               -d '{"username":"admin","pin":"7000","remember":false,"deviceId":"test"}' > output4.txt
          cat output4.txt
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add output4.txt
          git commit -m "Capture login"
          git push
