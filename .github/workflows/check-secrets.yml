name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Secrets
        run: |
          echo "DB URL length: ${#TURSO_DATABASE_URL}" > results.txt
          echo "DB URL starts with: ${TURSO_DATABASE_URL:0:30}" >> results.txt
          echo "Token length: ${#TURSO_AUTH_TOKEN}" >> results.txt
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add results.txt
          git commit -m "Secret check"
          git push
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
