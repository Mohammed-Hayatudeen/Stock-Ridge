name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          echo "DB URL length: ${#TURSO_DATABASE_URL}"
          echo "DB URL starts with: ${TURSO_DATABASE_URL:0:30}"
          echo "Token length: ${#TURSO_AUTH_TOKEN}"
          echo "Token starts with: ${TURSO_AUTH_TOKEN:0:15}"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
