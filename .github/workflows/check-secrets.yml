name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Diagnose
        run: |
          curl -s https://beta.stockridge0.workers.dev/api/diagnose > output.txt
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add output.txt
          git commit -m "Capture diagnose"
          git push
