name: Deploy StockRidge production

on:
  workflow_dispatch:
  push:
    branches:
      - arena/710a3fbd-stock-ridge

permissions:
  contents: read

concurrency:
  group: stockridge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/710a3fbd-stock-ridge

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secret presence
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"
          test "${#JWT_SECRET}" -ge 32

      # SQLCipher is only for native wrappers. Do not compile it in Worker CI.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run turso:check
      - name: Run Turso migrations with API-readable failure evidence
        run: |
          set +e
          output="$(npm run turso:migrate 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            escaped="$(printf '%s\n' "$output" | tail -n 12 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            printf '::error::%s\n' "$escaped"
            exit "$status"
          fi

      - name: Configure Worker secrets
        run: |
          printf '%s' "$TURSO_AUTH_TOKEN" | npx wrangler secret put TURSO_AUTH_TOKEN --env "" --config worker/wrangler.toml
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env "" --config worker/wrangler.toml

      - run: npx wrangler deploy --dry-run --env "" --config worker/wrangler.toml --outdir .cache/worker-dry-run
      - run: npm run worker:deploy

      - name: Verify deployed readiness
        run: |
          response="$(curl --fail --silent --show-error https://stockridge.stockridge.workers.dev/api/diagnose)"
          printf '%s\n' "$response"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(!r.ok)process.exit(1)})"
