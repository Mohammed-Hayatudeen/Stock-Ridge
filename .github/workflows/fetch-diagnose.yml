name: Fetch Diagnose
on: workflow_dispatch
permissions:
  pull-requests: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OUT=$(curl -s https://beta.stockridge0.workers.dev/api/diagnose)
          gh issue comment 52 --body "\`\`\`json
          $OUT
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
