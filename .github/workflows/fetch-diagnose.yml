name: Fetch Diagnose
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://beta.stockridge0.workers.dev/api/diagnose > diagnose.json || echo "{}" > diagnose.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnose.json
          git commit -m "Add diagnose.json"
          git push
