name: Seed Turso Database

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Test Accounts Seed
        run: node tools/seed-test-accounts.js

      - name: Run Cleanup DB
        run: node tools/cleanup-db.js

      - name: Commit test-accounts.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/test-accounts.md
          git commit -m "Docs: Update test-accounts.md with remaining users" || echo "No changes to commit"
          git push origin main
